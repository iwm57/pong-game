<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cheerleaders -->
    <div class="cheerleader top-left">
        <div class="head">◉</div>
        <div class="body">🙆</div>
        <div class="pom-poms">
            <span class="pom left">🎀</span>
            <span class="pom right">🎀</span>
        </div>
    </div>
    <div class="cheerleader top-right">
        <div class="head">◉</div>
        <div class="body">🙆</div>
        <div class="pom-poms">
            <span class="pom left">🎀</span>
            <span class="pom right">🎀</span>
        </div>
    </div>
    <div class="cheerleader bottom-left">
        <div class="head">◉</div>
        <div class="body">🙆</div>
        <div class="pom-poms">
            <span class="pom left">🎀</span>
            <span class="pom right">🎀</span>
        </div>
    </div>
    <div class="cheerleader bottom-right">
        <div class="head">◉</div>
        <div class="body">🙆</div>
        <div class="pom-poms">
            <span class="pom left">🎀</span>
            <span class="pom right">🎀</span>
        </div>
    </div>

    <div class="game-container">
        <div class="score-board">
            <span id="left-score" class="score">0</span>
            <span class="divider">-</span>
            <span id="right-score" class="score">0</span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="message" class="message">Press SPACE to Start</div>
        <div class="controls">
            <span class="speed-label">Speed:</span>
            <button class="speed-btn" data-speed="slow">Slow</button>
            <button class="speed-btn active" data-speed="medium">Medium</button>
            <button class="speed-btn" data-speed="fast">Fast</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
